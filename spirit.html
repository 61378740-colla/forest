<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
<title>森林小精灵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:radial-gradient(circle at center, #dff6d8 0%, #a8db82 45%, #6fae6a 100%);
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  /* 禁止长按复制 */
  -webkit-user-select: none;
  user-select: none;
}
.wrap{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.elf-img{
  width:280px;
  cursor:pointer;
  transition: transform 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.elf-img:active{
  transform:scale(0.95);
}
/* 语音按钮样式 */
.voice-btn{
  margin-top:20px;
  padding:12px 32px;
  border:none;
  border-radius:999px;
  background:#578c52;
  color:white;
  font-size:18px;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
}
.voice-btn:active{
  background:#447040;
}
.tip{
  margin-top:24px;
  color:#2c5424;
  font-size:18px;
  text-align:center;
}
.status{
  margin-top:12px;
  color:#3b7033;
  font-size:16px;
}
</style>
</head>
<body>
<div class="wrap">
  <img class="elf-img" src="spirit.GIF" alt="森林小精灵">
  <!-- 新增语音按钮 -->
  <button class="voice-btn" onclick="startListen()">🎤 点我和小精灵说话</button>
  <div class="tip">点击麦克风按钮，和它聊天✨</div>
  <div class="status" id="status"></div>
</div>

<script>
const synth = window.speechSynthesis;
let voiceList = [];
synth.onvoiceschanged = () => {
  voiceList = synth.getVoices();
};

function speak(text){
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-CN";
  utter.rate = 0.88;
  utter.pitch = 1.15;
  for(let v of voiceList){
    if(v.lang === "zh-CN"){
      utter.voice = v;
      break;
    }
  }
  synth.speak(utter);
}

const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = "zh-CN";
recognition.continuous = false;
recognition.interimResults = false;
recognition.maxAlternatives = 1;

const statusEl = document.getElementById("status");

recognition.onstart = function(){
  statusEl.innerText = "👂小精灵认真听你说话啦（慢慢说）";
};
recognition.onspeechstart = function(){
  statusEl.innerText = "听到你的声音咯～";
};
recognition.onerror = function(err){
  statusEl.innerText = "没有听到声音，再点麦克风试试吧";
  setTimeout(()=>{statusEl.innerText = ""},2000);
};
recognition.onend = function(){
  setTimeout(()=>{
    statusEl.innerText = "";
  },1500);
};
recognition.onresult = function(e){
  let words = e.results[0][0].transcript.trim();
  statusEl.innerText = "你说：" + words;

  if(words.includes("我要去运动啦")){
    setTimeout(()=>{
      speak("记得做好运动前的准备哦");
    },300);
  }else if(words.includes("我运动完啦")){
    setTimeout(()=>{
      speak("太棒啦！休息一下，喝点水补充能量吧");
    },300);
  }else if(words.includes("我玩累了")){
    setTimeout(()=>{
      speak("辛苦啦，快来补充能量吧！");
    },300);
  }else if(words.includes("早上好")){
    setTimeout(()=>{
      speak("早上好呀小探险家，今天也要勇敢闯关");
    },300);
  }else if(words.includes("再见")){
    setTimeout(()=>{
      speak("拜拜，期待下次和你一起探险哦");
    },300);
  }else if(words.includes("我找到宝藏啦")){
    setTimeout(()=>{
      speak("哇！你真厉害，恭喜找到宝藏");
    },300);
  }else{
    speak("哇，我听到啦，快来和我一起去森林探险吧！");
  }
};

function startListen(){
  try{
    recognition.start();
  }catch(e){
    statusEl.innerText = "正在听，请讲～";
  }
}
</script>
</body>
</html>
