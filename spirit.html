<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
<title>森林小精灵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:radial-gradient(circle at center, #dff6d8 0%, #a8db82 45%, #6fae6a 100%);
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}
.wrap{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.elf-img{
  width:280px;
  cursor:pointer;
  transition: transform 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.elf-img:active{
  transform:scale(0.95);
}
.tip{
  margin-top:24px;
  color:#2c5424;
  font-size:18px;
  text-align:center;
}
.status{
  margin-top:12px;
  color:#3b7033;
  font-size:16px;
}
</style>
</head>
<body>
<div class="wrap">
  <img class="elf-img" src="spirit.GIF" alt="森林小精灵" onclick="startListen()">
  <div class="tip">点击小精灵，和它说话✨</div>
  <div class="status" id="status"></div>
</div>

<script>
const synth = window.speechSynthesis;
let voiceList = [];
synth.onvoiceschanged = () => {
  voiceList = synth.getVoices();
};

// 可爱软一点的普通话朗读
function speak(text){
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-CN";
  utter.rate = 0.88; // 放慢速度，更柔和
  utter.pitch = 1.15; // 音调拉高，可爱童声感
  // 优先找中文可爱音色
  for(let v of voiceList){
    if(v.lang === "zh-CN"){
      utter.voice = v;
      break;
    }
  }
  synth.speak(utter);
}

// 语音识别，延长超时，适配手机
const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = "zh-CN";
recognition.continuous = false;
recognition.interimResults = false;
recognition.maxAlternatives = 1;

const statusEl = document.getElementById("status");

recognition.onstart = function(){
  statusEl.innerText = "👂小精灵认真听你说话啦（慢慢说）";
};
recognition.onspeechstart = function(){
  statusEl.innerText = "听到你的声音咯～";
};
recognition.onerror = function(err){
  statusEl.innerText = "没有听到声音，再点小精灵试试吧";
  setTimeout(()=>{statusEl.innerText = ""},2000);
};
recognition.onend = function(){
  // 识别结束清空提示
  setTimeout(()=>{
    statusEl.innerText = "";
  },1500);
};
recognition.onresult = function(e){
  let words = e.results[0][0].transcript.trim();
  statusEl.innerText = "你说：" + words;

  if(words.includes("我要去运动啦")){
    setTimeout(()=>{
      speak("记得做好运动前的准备哦");
    },300);
  }else if(words.includes("我运动完啦")){
    setTimeout(()=>{
      speak("太棒啦！休息一下，喝点水补充能量吧");
    },300);
  }else{
    speak("哇，我听到啦，快来和我一起去森林探险吧！");
  }
};

function startListen(){
  try{
    recognition.start();
  }catch(e){
    statusEl.innerText = "正在听，请讲～";
  }
}
</script>
</body>
</html>
